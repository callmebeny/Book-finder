<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Book Finder</h1>

  <form id="form">
    <label for="search">Book title or author:</label>
    <input type="text" id="search" placeholder="e.g. Harry Potter" required>
    <button type="submit">Search</button>
  </form>

  <div id="filter">
    <label for="year">Published after:</label>
    <input type="number" id="year" placeholder="e.g. 2000">
    <button type="button" id="filterButton">Filter</button>
  </div>

  <div id="results"></div>

  <script src="script.js"></script>
</body>
</html>
